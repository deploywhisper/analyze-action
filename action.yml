name: DeployWhisper Analyze Action
description: Submit changed infrastructure artifacts to DeployWhisper and enforce the configured GitHub Action policy decision.
author: DeployWhisper
branding:
  icon: shield
  color: orange
inputs:
  api-url:
    description: DeployWhisper base URL or explicit /api/v1/analyses endpoint.
    required: true
  api-token:
    description: Optional bearer token for the DeployWhisper API.
    required: false
    default: ""
  project-key:
    description: Project key for DeployWhisper project-scoped analysis. Leave blank only when the API endpoint derives project scope.
    required: false
    default: ""
  project-id:
    description: Numeric project id for DeployWhisper project-scoped analysis. Alternative to project-key.
    required: false
    default: ""
  workspace-key:
    description: Optional workspace or environment key within the selected project.
    required: false
    default: ""
  workspace-id:
    description: Optional numeric workspace or environment id within the selected project.
    required: false
    default: ""
  allow-derived-project-scope:
    description: Set true only when the DeployWhisper API endpoint derives project scope without a project-key or project-id input.
    required: false
    default: "true"
  changed-files:
    description: Optional comma or newline separated file list. Defaults to PR diff discovery.
    required: false
    default: ""
  working-directory:
    description: Repository path containing the checked-out pull request.
    required: false
    default: .
outputs:
  created:
    description: Whether a DeployWhisper report was created.
    value: ${{ steps.deploywhisper.outputs.created }}
  changed-file-count:
    description: Number of changed files detected for this run.
    value: ${{ steps.deploywhisper.outputs.changed-file-count }}
  submitted-artifact-count:
    description: Number of supported artifacts uploaded to DeployWhisper.
    value: ${{ steps.deploywhisper.outputs.submitted-artifact-count }}
  accepted-artifact-count:
    description: Number of artifacts accepted by the DeployWhisper API.
    value: ${{ steps.deploywhisper.outputs.accepted-artifact-count }}
  report-id:
    description: Persisted DeployWhisper report identifier.
    value: ${{ steps.deploywhisper.outputs.report-id }}
  report-link:
    description: Report link. Publicly shareable only when APP_BASE_URL or PUBLIC_APP_URL is configured; otherwise it may be local/private.
    value: ${{ steps.deploywhisper.outputs.report-link }}
  policy-status:
    description: Raw policy adapter status returned by the enforcement-decision endpoint.
    value: ${{ steps.deploywhisper.outputs.policy-status }}
  configured-mode:
    description: Configured enforcement mode applied for the github-action integration.
    value: ${{ steps.deploywhisper.outputs.configured-mode }}
  effective-status:
    description: Effective capped integration status after applying the configured enforcement mode ceiling.
    value: ${{ steps.deploywhisper.outputs.effective-status }}
  should-block:
    description: Whether the configured github-action enforcement decision should fail the workflow.
    value: ${{ steps.deploywhisper.outputs.should-block }}
  severity:
    description: Shared risk severity for the generated report.
    value: ${{ steps.deploywhisper.outputs.severity }}
  recommendation:
    description: Shared deployment recommendation for the generated report.
    value: ${{ steps.deploywhisper.outputs.recommendation }}
  share-summary-json:
    description: Machine-friendly share summary payload.
    value: ${{ steps.deploywhisper.outputs.share-summary-json }}
  share-summary-markdown:
    description: Markdown advisory summary returned by DeployWhisper.
    value: ${{ steps.deploywhisper.outputs.share-summary-markdown }}
  comment-id:
    description: Pull request comment identifier when the action posts or updates a comment.
    value: ${{ steps.deploywhisper.outputs.comment-id }}
  comment-url:
    description: Pull request comment URL when the action posts or updates a comment.
    value: ${{ steps.deploywhisper.outputs.comment-url }}
  comment-updated:
    description: Whether the action updated an existing PR comment instead of creating a new one.
    value: ${{ steps.deploywhisper.outputs.comment-updated }}
  skipped-files:
    description: JSON array of changed files skipped before upload.
    value: ${{ steps.deploywhisper.outputs.skipped-files }}
runs:
  using: composite
  steps:
    - id: deploywhisper
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PYTHONPATH: ${{ github.action_path }}
      run: |
        python3 "${{ github.action_path }}/run_action.py" \
          --api-url "${{ inputs.api-url }}" \
          --api-token "${{ inputs.api-token }}" \
          --project-key "${{ inputs.project-key }}" \
          --project-id "${{ inputs.project-id }}" \
          --workspace-key "${{ inputs.workspace-key }}" \
          --workspace-id "${{ inputs.workspace-id }}" \
          --allow-derived-project-scope "${{ inputs.allow-derived-project-scope }}" \
          --changed-files "${{ inputs.changed-files }}" \
          --working-directory "${{ inputs.working-directory }}"
